<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TradeSphere Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase (COMPAT VERSION - IMPORTANT) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
    }

    .left {
      width: 50%;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .right {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 300px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- LEFT -->
  <div class="left">
    <h1>TradeSphere</h1>
    <p>Virtual Trading App 💹</p>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="box">
      <h2>Login</h2>

      <!-- PHONE INPUT -->
      <input type="text" id="phone" placeholder="+91XXXXXXXXXX">

      <!-- RECAPTCHA -->
      <div id="recaptcha-container"></div>

      <!-- SEND OTP -->
      <button onclick="sendOTP()">Send OTP</button>

      <!-- OTP INPUT -->
      <input type="text" id="otp" placeholder="Enter OTP">

      <!-- VERIFY -->
      <button onclick="verifyOTP()">Verify OTP</button>
    </div>
  </div>

  <script>
    // 🔥 REPLACE WITH YOUR REAL CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyC3sfouocLF5PAKbUTadq8R991H__0LJco",
      authDomain: "tradesphere-6a20a.firebaseapp.com",
      projectId: "tradesphere-6a20a",
    };

    firebase.initializeApp(firebaseConfig);

    // Setup reCAPTCHA
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'normal'
    });

    // Send OTP
    function sendOTP() {
      const phone = document.getElementById("phone").value;

      firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier)
        .then(res => {
          window.confirmationResult = res;
          alert("OTP Sent!");
        })
        .catch(err => {
          alert(err.message);
        });
    }

    // Verify OTP
    function verifyOTP() {
      const otp = document.getElementById("otp").value;

      confirmationResult.confirm(otp)
        .then(result => {
          alert("Login Successful!");

          // Save user
          localStorage.setItem("user", result.user.phoneNumber);

          // Redirect
          window.location.href = "index.html";
        })
        .catch(() => {
          alert("Invalid OTP");
        });
    }
  </script>

</body>
</html>
